<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c100e">
<title>SCI — Sistema de Controle Interno</title>
<link rel="stylesheet" href="/style.css?v=368">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23275e42'/%3E%3Cpath d='M6 12.5l4 4 8-9' stroke='%238fd2a9' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div id="alertaConectividade">
  <span>⚠️ ALERTA: Conexão com o servidor perdida (mais de 10s sem resposta). Tentando reconectar…</span>
</div>
<div id="layoutApp" class="layout-app">
  <aside id="sidebar" class="sidebar oculto"></aside>
  <div id="viewport" class="viewport">
    <div class="viewport-mobile-bar" id="mobileBar">
      <button type="button" id="btMobileMenu" class="btn-sidebar-toggle" aria-label="Abrir Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="sidebar-logo" style="font-size:15px">SCI</span>
      <div class="sidebar-sino-wrapper">
        <button id="mobSinoNotif" type="button" class="btn-sidebar-sino" aria-label="Mensagens e Notificações" title="Mensagens e Notificações">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span id="mobBadgeNotif" class="badge-mini oculto">0</span>
          <span id="mobBadgeAvisos" class="badge-mini badge-avisos oculto">0</span>
        </button>
        <div class="sino-hover-card" id="mobSinoHoverCard">
          <div class="sino-hover-header">Resumo de Notificações</div>
          <div class="sino-hover-item" id="mobSinoHoverMsgItem">
            <span class="sino-hover-icon">📬</span>
            <span id="mobSinoHoverMsgTxt">0 mensagens não lidas</span>
          </div>
          <div class="sino-hover-item" id="mobSinoHoverAvisosItem">
            <span class="sino-hover-icon">📢</span>
            <span id="mobSinoHoverAvisosTxt">0 novos comunicados</span>
          </div>
          <div class="sino-hover-item" id="mobSinoHoverCautItem">
            <span class="sino-hover-icon">⏰</span>
            <span id="mobSinoHoverCautTxt">0 alertas de material</span>
          </div>
          <div class="sino-hover-footer">Toque para abrir Mensagens</div>
        </div>
      </div>
    </div>
    <main id="app"><div class="carregando">Conectando…</div></main>
  </div>
</div>
<div id="toasts"></div>
<script src="/lazy.js?v=368"></script>
<script src="/editor_rico.js?v=368"></script>
<script src="/core.js?v=368"></script>
<script>window._lazy_antes_boot&&window._lazy_antes_boot();window.SCI_BOOT&&SCI_BOOT();</script>
</body>
</html>
